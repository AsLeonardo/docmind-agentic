spring:
  application:
    name: docmind
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docmind}
    username: ${DB_USER:docmind}
    password: ${DB_PASSWORD:docmind}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    async:
      request-timeout: 120s
  ai:
    model:
      # só usamos chat e embeddings; desliga os demais clientes da OpenAI
      audio.speech: none
      audio.transcription: none
      image: none
      moderation: none
    # Qualquer API compatível com OpenAI. O padrão usa o Gemini (plano gratuito) para chat e embeddings.
    openai:
      api-key: ${LLM_API_KEY:missing}
      base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: /chat/completions
        options:
          model: ${LLM_CHAT_MODEL:gemini-2.5-flash}
          temperature: 0.2
      embedding:
        # embeddings podem vir de outro provedor (ex.: chat no Groq, embeddings no Gemini)
        api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:missing}}
        base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}}
        embeddings-path: /embeddings
        options:
          model: ${EMBEDDING_MODEL:gemini-embedding-001}
          dimensions: ${EMBEDDING_DIMENSIONS:768}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        distance-type: COSINE_DISTANCE
        index-type: HNSW

docmind:
  rag:
    chunk-size: 250
    top-k: 5
    similarity-threshold: 0.0
  security:
    jwt-secret: ${JWT_SECRET:troque-este-segredo-em-producao-0123456789}
    token-ttl: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
