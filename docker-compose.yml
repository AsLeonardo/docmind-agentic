services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docmind}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/docmind
      DB_PASSWORD: ${DB_PASSWORD:-docmind}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
