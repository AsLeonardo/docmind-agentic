server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8080;
        # streaming: repassa cada evento SSE assim que chega, sem bufferizar
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
